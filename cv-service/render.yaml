# Render blueprint for the CV service.
#
# Deploy: Render dashboard → New → Blueprint → point at this repo. Render reads
# this file, builds the Dockerfile in ./cv-service, and prompts for the two
# values it cannot know on its own (OPENAI_API_KEY, ALLOWED_ORIGINS).
#
# The frontend stays on Vercel — it is a static Vite build and Vercel does that
# better. Only this service needs a container, because ReportLab and the
# in-memory session store both need a real long-lived process, which Vercel's
# serverless functions are not.

services:
  - type: web
    name: cv-service
    runtime: docker
    dockerfilePath: ./cv-service/Dockerfile
    dockerContext: ./cv-service
    # Frankfurt is the closest region to Morocco; every request is a round trip
    # to OpenAI anyway, but the upload of a CV is not.
    region: frankfurt
    plan: free

    healthCheckPath: /health

    # Still one instance, for a narrower reason than before. A session's
    # draft now survives this process dying (app/db.py writes it through to
    # Postgres, app/session.py reads it back on a miss) — but the API-key
    # pool (app/keypool.py) and the rate limiter (app/ratelimit.py) are still
    # per-process in-memory state with no Postgres backing. A second instance
    # would strand half the key pool's cooldown tracking on the wrong machine
    # and double the effective rate limits (each instance counts requests
    # separately). Raising this needs the DB-backed rate limiter NEXT.md Step
    # 4 still calls out as not done — the key pool can stay per-process either
    # way, since a key's cooldown resetting slightly early on a scale-out is
    # a much smaller problem than a visitor's CV disappearing was.
    numInstances: 1

    envVars:
      # Marked sync:false so Render prompts for it and stores it encrypted,
      # rather than reading a key out of a file committed to the repo.
      - key: OPENAI_API_KEY
        sync: false

      # Must list the deployed frontend's exact origin, no trailing slash, or
      # every browser request is blocked by CORS while curl keeps working —
      # which is a confusing hour to spend.
      - key: ALLOWED_ORIGINS
        sync: false

      # The same Supabase project the portfolio already uses
      # (VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY in the frontend's env).
      # The anon key is safe to commit here — it already ships in the
      # frontend's browser bundle; Supabase's RLS policies are what actually
      # protect the data, not secrecy of this key. Only service_role would be
      # a real secret, and this service never uses it — see app/auth.py.
      - key: SUPABASE_URL
        value: https://ksgqrbghwbfdhwvvmbym.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_9U_JSoOImoZ_b8QBqF1h4g_ibcyZTUb

      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: MAX_SESSION_TOKENS
        value: "60000"
      - key: PYTHONUNBUFFERED
        value: "1"
