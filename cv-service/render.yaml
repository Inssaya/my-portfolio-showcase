# Render blueprint for the CV service.
#
# Deploy: Render dashboard → New → Blueprint → point at this repo. Render reads
# this file, builds the Dockerfile in ./cv-service, and asks for the one secret
# it needs.
#
# The frontend stays on Vercel — it is a static Vite build and Vercel does that
# better. Only this service needs a container, because ReportLab and the
# in-memory session store both need a real long-lived process, which Vercel's
# serverless functions are not.

services:
  - type: web
    name: cv-service
    runtime: docker
    dockerfilePath: ./cv-service/Dockerfile
    dockerContext: ./cv-service
    # Frankfurt is the closest region to Morocco; every request is a round trip
    # to OpenAI anyway, but the upload of a CV is not.
    region: frankfurt
    plan: free

    healthCheckPath: /health

    # One instance, and this is not a cost decision. Sessions and the API-key
    # pool are per-process (see app/session.py, app/keypool.py): a second
    # instance would strand half of all drafts on the wrong machine and double
    # the effective rate limits. Scaling out needs Phase 2's move to Supabase.
    numInstances: 1

    envVars:
      # Marked sync:false so Render prompts for it and stores it encrypted,
      # rather than reading a key out of a file committed to the repo.
      - key: OPENAI_API_KEY
        sync: false

      # Must list the deployed frontend's exact origin, no trailing slash, or
      # every browser request is blocked by CORS while curl keeps working —
      # which is a confusing hour to spend.
      - key: ALLOWED_ORIGINS
        sync: false

      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: MAX_SESSION_TOKENS
        value: "60000"
      - key: PYTHONUNBUFFERED
        value: "1"
